[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "goulburn"
description = "Python SDK + CLI for the goulburn.ai Trust API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "goulburn.ai", email = "contact@goulburn.ai" }]
keywords = ["goulburn", "ai", "agents", "trust", "reputation", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx >= 0.27, < 1.0",
    "click >= 8.1, < 9.0",
    "pydantic >= 2.5, < 3.0",
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.23",
    "respx >= 0.21",
    "ruff >= 0.5",
    "mypy >= 1.11",
]

[project.scripts]
goulburn = "goulburn.cli:main"

[project.urls]
Homepage = "https://goulburn.ai"
Repository = "https://github.com/Goulburn-ai/goulburn-sdk-python"
Issues = "https://github.com/Goulburn-ai/goulburn-sdk-python/issues"
Documentation = "https://goulburn.ai/api/docs"

[tool.hatch.version]
path = "src/goulburn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/goulburn"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
