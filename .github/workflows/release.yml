name: release-pypi

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write    # softprops/action-gh-release creates the GitHub release
  id-token: write    # PyPI Trusted Publishing (OIDC); no long-lived token

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Protected environment: add a required reviewer in repo settings so a
    # pushed tag cannot publish on its own. Must match the PyPI trusted
    # publisher config (environment name "release").
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check artifacts
        run: twine check dist/*

      - name: Verify package version matches the tag
        run: |
          set -eo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(PYTHONPATH=src python -c "from goulburn import __version__; print(__version__)")
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package version ${PKG_VERSION}"
            exit 1
          fi

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: dist/*
